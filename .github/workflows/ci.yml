name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rps_auth_test
          POSTGRES_USER: rps_auth
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rps_auth -d rps_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rps_auth:ci_test_password@localhost:5432/rps_auth_test
      TEST_DATABASE_URL: postgresql+psycopg://rps_auth:ci_test_password@localhost:5432/rps_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint, formatting, tests
        run: python scripts/manage.py check
      - name: Apply migrations and check schema drift
        run: |
          python scripts/manage.py migrate
          python -m alembic check
      - name: Build package
        run: python -m pip wheel --no-deps --wheel-dir dist .

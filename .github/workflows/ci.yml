name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rps_auth_test
          POSTGRES_USER: rps_auth
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rps_auth -d rps_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rps_auth:ci_test_password@localhost:5432/rps_auth_test
      TEST_DATABASE_URL: postgresql+psycopg://rps_auth:ci_test_password@localhost:5432/rps_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint, formatting, tests
        run: uv run scripts/manage.py check
      - name: Apply migrations and check schema drift
        run: |
          uv run scripts/manage.py migrate
          uv run alembic check
      - name: Build package
        run: uv build --wheel
